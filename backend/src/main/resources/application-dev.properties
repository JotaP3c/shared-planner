# PostgreSQL (active)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shared_planner_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# SQL Server reference:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shared_planner_dev;encrypt=true;trustServerCertificate=true
# spring.datasource.username=shared_planner_app
# spring.datasource.password=SharedPlanner@123
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=shared-planner-local-development-secret-key-with-at-least-32-characters
app.jwt.expiration-minutes=120
