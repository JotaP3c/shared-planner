# SQL Server (active)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=shared_planner_dev;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shared_planner_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SharedPlanner@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=shared-planner-local-development-secret-key-with-at-least-32-characters
app.jwt.expiration-minutes=120
